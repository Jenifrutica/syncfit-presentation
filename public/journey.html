<!doctype html>
<!-- SyncFit Edge — user journey (3D animated, Spanish). Nine stations with per-stage inputs/outputs: super admin, gym-admin equipment survey, athlete register/onboarding, join by code, hardware scan, IA #1 local (core), IA #2 DeepSeek with GPT-6 Luna backup, deterministic validator, train/track/share. Drag to orbit; arrow keys to navigate. Needs internet (three.js CDN). -->
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>SyncFit Edge — Recorrido del sistema</title>
<style>
  :root{
    --ink:#0a0710; --panel:rgba(22,10,22,.9); --line:rgba(244,114,182,.32);
    --text:#ffeaf4; --muted:#d7a9c5; --pink:#ff4f9c; --pink-deep:#b3135f; --pink-soft:#f472b6; --cyan:#22d3ee;
    --radius:18px; --shadow:0 3px 8px -5px rgba(0,0,0,.78);
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--font)}
  ::selection{background:var(--pink);color:#fff}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
  #c{position:fixed;inset:0;display:block;width:100vw;height:100vh}

  /* top bar */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:16px 22px;pointer-events:none;
    background:linear-gradient(180deg, rgba(10,7,16,.85), rgba(10,7,16,0));}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mark{width:26px;height:26px;flex:0 0 26px}
  .brand h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
  .brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
  .hint{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}

  /* info sheet */
  .sheet{position:fixed;left:22px;bottom:22px;z-index:20;width:min(560px,42vw);background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);
    transition:opacity .28s var(--ease), transform .28s var(--ease)}
  .sheet.swapping{opacity:0;transform:translateY(8px)}
  .head{display:flex;align-items:center;gap:10px;margin:0 0 8px}
  .head h2{margin:0;font-size:clamp(15px,1.35vw,17px);font-weight:680;letter-spacing:-.015em}
  .tag{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:#fff;background:var(--pink-deep);border-radius:999px;padding:3px 9px}
  .desc{margin:0 0 14px;font-size:13px;line-height:1.55;color:var(--text);opacity:.9;max-width:64ch}
  .io{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
  .io h3{margin:0 0 7px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--pink-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;line-height:1.3;border:1px solid var(--line);border-radius:8px;padding:3px 8px;color:var(--text);
    background:rgba(255,79,156,.08)}
  .io .col:last-child .chip{border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.08)}

  /* controls */
  .dock{position:fixed;right:22px;bottom:22px;z-index:20;display:flex;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px;box-shadow:var(--shadow)}
  .dock .count{font-size:12px;color:var(--muted);padding:0 8px;font-variant-numeric:tabular-nums}
  .btn{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:600;color:#fff;
    background:var(--pink-deep);border-radius:999px;padding:10px 18px;font-size:13px;transition:transform .18s var(--ease), filter .18s var(--ease)}
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);padding:10px 14px}
  .btn.icon{padding:10px 13px;font-variant-numeric:tabular-nums}
  .btn[aria-pressed="true"]{background:transparent;border:1px solid var(--line)}

  .dots{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;z-index:20;display:flex;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;border:0;padding:0;cursor:pointer;background:rgba(255,255,255,.22);
    transition:transform .2s var(--ease), background .2s var(--ease)}
  .dot:hover{background:rgba(255,255,255,.45)}
  .dot[aria-current="true"]{background:var(--pink-deep);transform:scale(1.3);box-shadow:0 2px 6px -2px rgba(0,0,0,.65)}

  /* custom scrollbar inside the sheet on small screens */
  .sheet{scrollbar-width:thin;scrollbar-color:var(--pink-soft) transparent}
  .sheet::-webkit-scrollbar{width:9px}
  .sheet::-webkit-scrollbar-thumb{background:rgba(244,114,182,.55);border-radius:9px;border:2px solid transparent;background-clip:content-box}

  @media (max-width:900px){
    .topbar{padding:12px 14px}
    .brand p{display:none}
    .hint{display:none}
    .sheet{left:10px;right:10px;bottom:88px;width:auto;max-height:46vh;overflow:auto;padding:15px 16px}
    .io{grid-template-columns:1fr}
    .dock{right:auto;left:50%;transform:translateX(-50%);bottom:14px}
    .dots{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .sheet,.btn,.dot{transition:none !important}
  }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<header class="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2c1.6 3.2 4.4 4 6.6 4 .5 6.4-3 11.4-6.6 16-3.6-4.6-7.1-9.6-6.6-16C7.6 6 10.4 5.2 12 2Z" fill="#ff4f9c"/>
      <circle cx="12" cy="10" r="2.4" fill="#fff"/>
    </svg>
    <div>
      <h1>SyncFit Edge · recorrido del sistema</h1>
      <p>Las dos IAs y el flujo de datos, extremo a extremo.</p>
    </div>
  </div>
  <p class="hint">Arrastra para orbitar · rueda para acercar<br/>← → para navegar · espacio para pausar</p>
</header>

<aside class="sheet" id="sheet" aria-live="polite">
  <div class="head">
    <h2 id="st-title">—</h2>
    <span class="tag" id="who">—</span>
  </div>
  <p class="desc" id="st-desc">—</p>
  <div class="io">
    <div class="col"><h3>Datos de entrada</h3><div class="chips" id="in-list"></div></div>
    <div class="col"><h3>Datos de salida</h3><div class="chips" id="out-list"></div></div>
  </div>
</aside>

<nav class="dots" id="dots" aria-label="Estaciones"></nav>

<div class="dock">
  <button class="btn ghost icon" id="prev" aria-label="Estación anterior">←</button>
  <span class="count" id="count">01 / 09</span>
  <button class="btn" id="next">Siguiente</button>
  <button class="btn ghost" id="play" aria-pressed="false">Pausar</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0710);
scene.fog = new THREE.FogExp2(0x0a0710, 0.010);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 600);

scene.add(new THREE.HemisphereLight(0xffd9ec, 0x241026, 0.62));
const key = new THREE.DirectionalLight(0xff8ec7, 1.15); key.position.set(12, 20, 14); key.castShadow = true;
key.shadow.mapSize.set(1024,1024); key.shadow.camera.left=-70; key.shadow.camera.right=70; key.shadow.camera.top=70; key.shadow.camera.bottom=-70;
key.shadow.bias = -0.0005; scene.add(key);
const rim = new THREE.DirectionalLight(0x66c9ff, 0.7); rim.position.set(-14, 9, -12); scene.add(rim);

// floor + spotlight pool
const floor = new THREE.Mesh(new THREE.PlaneGeometry(700, 160), new THREE.MeshStandardMaterial({ color:0x160b17, roughness:.96, metalness:0 }));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
const poolCanvas = document.createElement("canvas"); poolCanvas.width = poolCanvas.height = 512;
{ const x = poolCanvas.getContext("2d"); const g = x.createRadialGradient(256,256,20,256,256,256);
  g.addColorStop(0,"rgba(255,79,156,.28)"); g.addColorStop(.5,"rgba(124,58,237,.10)"); g.addColorStop(1,"rgba(0,0,0,0)");
  x.fillStyle=g; x.fillRect(0,0,512,512); }
const pool = new THREE.Mesh(new THREE.PlaneGeometry(700,160), new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(poolCanvas), transparent:true, depthWrite:false }));
pool.rotation.x = -Math.PI/2; pool.position.y = 0.02; scene.add(pool);
const grid = new THREE.GridHelper(700, 175, 0x5a2a4a, 0x27132a); grid.position.y = 0.015; grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);

// starfield for depth
{
  const n = 500, pos = new Float32Array(n*3);
  for (let i=0;i<n;i++){ pos[i*3]=(Math.random()-0.5)*320; pos[i*3+1]=Math.random()*60+6; pos[i*3+2]=(Math.random()-0.5)*160; }
  const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color:0xf9a8d4, size:0.5, transparent:true, opacity:0.5, sizeAttenuation:true })));
}

const world = new THREE.Group(); scene.add(world);
const SPACING = 18;
const animated = [], rings = [], platforms = [];

const mat = (color, opts={}) => new THREE.MeshStandardMaterial({ color, roughness:0.6, metalness:0.1, ...opts });
const box = (w,h,d,color,opts={}) => { const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(color,opts)); m.castShadow=m.receiveShadow=true; return m; };
const cyl = (rt,rb,h,color,opts={}) => { const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,22), mat(color,opts)); m.castShadow=true; return m; };
const ball = (r,color,opts={}) => { const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,20), mat(color,opts)); m.castShadow=true; return m; };
const capsule = (r,len,color,opts={}) => { const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,len,8,16), mat(color,opts)); m.castShadow=true; return m; };

function person({ skin=0xf2c9a0, hair=0x3a2418, top=0xff4f9c, bottom=0x27324a, bald=false, beard=false, ponytail=false, pants=false } = {}) {
  const g = new THREE.Group();
  for (const sx of [-0.16, 0.16]) { const leg = capsule(0.12, 0.6, pants ? bottom : 0x33405c); leg.position.set(sx, 0.5, 0); g.add(leg); }
  const torso = capsule(0.24, 0.5, top); torso.position.y = 1.15; g.add(torso);
  const arms = [];
  for (const sx of [-0.34, 0.34]) { const arm = capsule(0.09, 0.5, skin); arm.position.set(sx, 1.28, 0); arm.rotation.z = sx>0?-0.15:0.15; g.add(arm); arms.push(arm); }
  const head = ball(0.2, skin); head.position.y = 1.72; g.add(head);
  if (!bald) { const h = ball(0.215, hair); h.position.y = 1.77; h.scale.set(1,0.72,1); g.add(h); }
  if (ponytail) { const pt = capsule(0.07,0.4,hair); pt.position.set(0,1.7,-0.24); pt.rotation.x=0.5; g.add(pt); }
  if (beard) { const b = ball(0.17, hair); b.position.set(0,1.6,0.08); b.scale.set(1,0.75,1); g.add(b); }
  g.userData = { arms, bob: Math.random()*Math.PI*2 };
  animated.push({ type:"person", g }); return g;
}
function label(text){ const c=document.createElement("canvas"); c.width=1024; c.height=180; const x=c.getContext("2d");
  x.font="700 54px ui-sans-serif, system-ui, sans-serif"; x.fillStyle="#ffffff"; x.textAlign="center"; x.letterSpacing="1px"; x.fillText(text,512,104);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,opacity:.95})); s.scale.set(6.2,1.09,1); return s; }

const STATIONS = [
  { who:"Super admin", title:"Administración de la plataforma",
    desc:"Rol administrativo puro. Gestiona usuarios y perfiles: activar, desactivar (soft), restablecer contraseña, cambiar rol y eliminar (hard, en cascada, pidiendo su contraseña). No crea gimnasios ni máquinas.",
    inputs:["cuenta + rol","cédula / email"], outputs:["cuenta Gym Admin","usuarios gestionados"],
    build(g){ const desk=box(3.2,1.0,1.1,0x6b4a2f); desk.position.set(0,0.5,0.6); g.add(desk);
      const screen=box(1.1,0.7,0.08,0x111827,{emissive:0x1e293b}); screen.position.set(0,1.35,0.25); screen.rotation.x=-0.35; g.add(screen);
      const a=person({bald:true,beard:true,top:0x7c3aed,bottom:0x1f2937}); a.position.set(-0.4,0,-0.9); a.rotation.y=0.5; g.add(a);
      const b=person({top:0xff4f9c,ponytail:true,pants:true,bottom:0x334155}); b.position.set(1.1,0,-0.6); b.rotation.y=-0.6; g.add(b); }},
  { who:"Admin de gimnasio", title:"Sondeo de máquinas y equipo",
    desc:"Crea el gimnasio y registra cada máquina y equipo libre. La IA infiere tipo, propósito y ejercicios desde el nombre; el peso se escala con weight_factor. Comparte el código y el QR para que las usuarias se unan.",
    inputs:["nombre, descripción, foto","ejercicios, tipo de equipo","weight_factor"], outputs:["inventario del gym","código + QR"],
    build(g){ const machine=new THREE.Group(); machine.add(box(1.6,1.6,1.0,0x94a3b8)); const seat=box(1.2,0.2,0.8,0x475569); seat.position.set(0,0.7,-0.6); machine.add(seat);
      for (const sx of [-1,1]) { const pl=cyl(0.35,0.35,0.12,0x111827); pl.rotation.z=Math.PI/2; pl.position.set(sx*0.9,0.4,0); machine.add(pl); }
      machine.position.set(1.5,0.9,0); g.add(machine);
      const t=person({bald:true,beard:true,top:0x2563eb,pants:true,bottom:0x1f2937}); t.position.set(-0.8,0,0.4); t.rotation.y=-0.5; g.add(t);
      const tab=box(0.5,0.35,0.05,0x0f172a,{emissive:0x1d4ed8}); tab.position.set(-0.55,1.25,0.55); g.add(tab); }},
  { who:"Usuaria", title:"Registro y onboarding",
    desc:"La usuaria se registra con su cédula y completa el onboarding: modalidad (ciclo menstrual o embarazo), objetivo, composición corporal, síntomas (dolor 1–10) y metas semanales.",
    inputs:["cédula, email, contraseña","modalidad y fase/semana","objetivo, medidas, síntomas"], outputs:["UserProfile guardado","línea de ciclo/embarazo"],
    build(g){ const w=person({top:0xff4f9c,ponytail:true,pants:true,bottom:0x334155}); w.position.set(-0.6,0,0); g.add(w);
      const panel=box(1.8,2.2,0.08,0xfdf2f8,{emissive:0x3b0a25}); panel.position.set(1.0,1.2,0); g.add(panel);
      for (let i=0;i<4;i++){ const row=box(1.4,0.12,0.02,0xff4f9c); row.position.set(1.0,1.9-i*0.42,0.06); g.add(row); } }},
  { who:"Usuaria", title:"Se une al gimnasio por código",
    desc:"Ingresa el código del gimnasio y su inventario queda disponible en vivo (membresía). Si pertenece a varios, cambia el gimnasio activo, que define qué equipo usa la rutina.",
    inputs:["código del gimnasio"], outputs:["membresía (perfil, gimnasio)","gimnasio activo + equipo"],
    build(g){ const w=person({top:0xff4f9c,ponytail:true,pants:true,bottom:0x334155}); w.position.set(-0.6,0,0.2); g.add(w);
      const phone=box(0.5,0.9,0.06,0x0f172a,{emissive:0x0ea5e9}); phone.position.set(0.2,1.1,0.35); phone.rotation.y=-0.3; g.add(phone);
      const qr=new THREE.Group(); for (let i=0;i<5;i++){ const q=box(0.12,0.12,0.02,0xffffff); q.position.set((i%2)*0.16-0.08, Math.floor(i/2)*0.16-0.16, 0); qr.add(q); }
      qr.position.set(1.6,1.4,0.2); g.add(qr); }},
  { who:"Hardware", title:"Escaneo: datos crudos",
    desc:"En la estación: dedo en el sensor PPG (100 Hz), temperatura dérmica y agarre isométrico (3 s). Todo se empaqueta como un frame de telemetría que respeta el contrato.",
    inputs:["PPG 100 Hz (MAX30102)","ΔT dérmica (MLX90614)","fuerza isométrica (HX711)"], outputs:["TelemetryFrame crudo","ventana PPG de 256 muestras"],
    build(g){ const table=box(2.4,0.15,1.2,0x475569); table.position.set(0,0.75,0.5); g.add(table);
      for (const sx of [-1,1]) { const leg=cyl(0.06,0.06,0.75,0x334155); leg.position.set(sx*1.0,0.38,0.5); g.add(leg); }
      const sensor=cyl(0.28,0.28,0.12,0x111827,{emissive:0xdc2626}); sensor.position.set(-0.5,0.85,0.5); g.add(sensor);
      const grip=cyl(0.12,0.12,0.5,0x64748b); grip.rotation.z=Math.PI/2; grip.position.set(0.5,0.9,0.5); g.add(grip);
      const w=person({top:0xff4f9c,ponytail:true,pants:true,bottom:0x334155}); w.position.set(0,0,-0.8); w.rotation.y=Math.PI; g.add(w);
      const scan=new THREE.Mesh(new THREE.TorusGeometry(2.6,0.06,10,60), new THREE.MeshBasicMaterial({color:0x22d3ee})); scan.rotation.x=Math.PI/2; scan.position.set(-0.5,0.5,0.5); scan.scale.setScalar(0.6); g.add(scan); animated.push({type:"scan",mesh:scan}); }},
  { who:"IA #1 · core local", title:"El modelo local sintetiza los datos",
    desc:"DSP (Butterworth 0.5–5 Hz) limpia el PPG y calcula RMSSD; un Random Forest / XGBoost estima la fatiga central y produce el multiplicador k_load (0.70–1.05). El Grafo de Estados da la fase. Determinista y offline.",
    inputs:["TelemetryFrame crudo","[modalidad, día/semana, ΔT, RMSSD, %fuerza]"], outputs:["RMSSD, fatiga, fase","k_load determinista","PhysiologicalAssessment"],
    build(g){ const chip=box(1.6,0.5,1.6,0x0b1220,{emissive:0x0ea5e9}); chip.position.y=1.3; g.add(chip);
      for (let i=0;i<8;i++){ const p=box(0.08,0.25,0.08,0xbae6fd,{emissive:0x38bdf8}); p.position.set(-0.7+(i%4)*0.46, 1.0, i<4?-0.9:0.9); g.add(p); }
      const pts=[]; for (let i=0;i<40;i++){ pts.push(new THREE.Vector3(-2+i*0.1, Math.sin(i*0.6)*0.25, 0)); }
      const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:0x22d3ee})); line.position.set(0,1.9,0); g.add(line); animated.push({type:"wave",mesh:line});
      for (let i=0;i<8;i++){ const s=ball(0.07,0x38bdf8,{emissive:0x38bdf8}); g.add(s); animated.push({type:"orbit",mesh:s,r:2.0,y:1.4,ph:Math.random()*6.28,sp:0.7}); } }},
  { who:"IA #2 · DeepSeek / GPT-6 Luna", title:"IA generativa diseña la rutina",
    desc:"Recibe la evaluación y todos los datos, razona con evidencia (volumen, reps, descanso, compuestos primero) y elige el ejercicio de cada patrón respetando el equipo del gimnasio. Devuelve la rutina completa con su justificación en JSON estricto. Nunca recalcula k_load.",
    inputs:["assessment + k_load","perfil, objetivo, síntomas","catálogo + equipo del gym","guías de evidencia"], outputs:["rutina completa + rationale","patrones, series, reps, descanso"],
    build(g){ const core=new THREE.Mesh(new THREE.IcosahedronGeometry(1.1,1), new THREE.MeshStandardMaterial({color:0xff4f9c,emissive:0xff4f9c,emissiveIntensity:0.55,roughness:0.3,metalness:0.4}));
      core.position.y=1.6; g.add(core); animated.push({type:"spin",mesh:core});
      for (let i=0;i<12;i++){ const s=ball(0.08,0x22d3ee,{emissive:0x22d3ee}); g.add(s); animated.push({type:"orbit",mesh:s,r:1.9+Math.random()*0.7,y:1.6,ph:Math.random()*6.28,sp:0.6+Math.random()*0.7}); }
      const robot=person({top:0x0ea5e9,bald:true,skin:0x9fb3c8}); robot.position.set(-2.4,0,0); robot.rotation.y=0.6; g.add(robot);
      const woman=person({top:0xff4f9c,ponytail:true,pants:true}); woman.position.set(2.4,0,0); woman.rotation.y=-0.6; g.add(woman); }},
  { who:"Validador", title:"Guardarraíles deterministas",
    desc:"No diseña: repara y garantiza. Normaliza ids, excluye contraindicaciones (rodilla → sin búlgara; lumbar → sin peso muerto), evita patrón duplicado, cubre patrones requeridos, ordena compuestos primero, fuerza la máquina del gimnasio y hace eco de k_load.",
    inputs:["rutina de la IA","reglas de seguridad + síntomas","reglas de evidencia","equipo disponible"], outputs:["rutina validada y segura","machine_preferences + alertas"],
    build(g){ const shield=new THREE.Mesh(new THREE.TorusGeometry(1.5,0.18,16,60), mat(0xf59e0b,{emissive:0xf59e0b,emissiveIntensity:0.4})); shield.position.y=1.6; g.add(shield); animated.push({type:"spin",mesh:shield,y:1.6});
      const check=new THREE.Group(); const c1=box(0.9,0.1,0.06,0x22c55e,{emissive:0x22c55e}); c1.position.set(0,1.7,0.1); c1.rotation.z=0.6; check.add(c1);
      const c2=box(0.5,0.1,0.06,0x22c55e,{emissive:0x22c55e}); c2.position.set(0.42,1.5,0.1); c2.rotation.z=-0.6; check.add(c2); g.add(check);
      const woman=person({top:0x22c55e,ponytail:true,pants:true}); woman.position.set(-2.4,0,0); woman.rotation.y=0.6; g.add(woman); }},
  { who:"Usuaria", title:"Entrena, registra y comparte",
    desc:"Realiza la rutina con temporizadores y registro de peso por serie, cambia ejercicios con la lista de alternativas, registra suplementos y comparte un perfil de solo lectura con su entrenadora.",
    inputs:["rutina validada","peso por serie, energía"], outputs:["sesión + telemetría","estadísticas y racha","enlaces para compartir"],
    build(g){ const w=person({top:0xff4f9c,ponytail:true,pants:true,bottom:0x334155}); w.position.set(0,0,0); g.add(w);
      const bar=cyl(0.05,0.05,3.0,0x9ca3af); bar.rotation.z=Math.PI/2; bar.position.set(0,1.9,0.35); g.add(bar);
      for (const sx of [-1.1,1.1]) { const pl=cyl(0.4,0.4,0.14,0x111827); pl.rotation.z=Math.PI/2; pl.position.set(sx,1.9,0.35); g.add(pl); }
      for (const sx of [-0.55,0.55]) { const pl=cyl(0.28,0.28,0.14,0xff4f9c); pl.rotation.z=Math.PI/2; pl.position.set(sx,1.9,0.35); g.add(pl); }
      const coach=person({top:0x22c55e,ponytail:true}); coach.position.set(2.4,0,0.4); coach.rotation.y=-0.8; g.add(coach); }},
];

STATIONS.forEach((st, i) => {
  const g = new THREE.Group(); g.position.x = i * SPACING; world.add(g);
  const pf = new THREE.Mesh(new THREE.CylinderGeometry(4.6,4.8,0.3,44), mat(0x2a1630,{emissive:0x2a0d22})); pf.receiveShadow = true; g.add(pf); platforms.push(pf);
  const r = new THREE.Mesh(new THREE.TorusGeometry(2.6,0.06,10,60), new THREE.MeshBasicMaterial({ color:0x7c3aed, transparent:true, opacity:.45 })); r.rotation.x = Math.PI/2; r.position.y = 0.18; g.add(r); rings.push(r);
  const lbl = label(st.title.split(":")[0].split("·")[0].trim()); lbl.position.set(0, 4.35, 0); g.add(lbl);
  st.build(g);
});

const dotsEl = document.getElementById("dots");
STATIONS.forEach((_, i) => {
  const b = document.createElement("button"); b.className="dot"; b.type="button"; b.setAttribute("aria-label", `Estación ${i+1}`);
  b.addEventListener("click", () => go(i)); dotsEl.appendChild(b);
});

let current = 0, auto = !reduce, autoT = 0;
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false; controls.minDistance = 8; controls.maxDistance = 46;
controls.target.set(0, 1.6, 0);

function stationView(i) {
  const aspect = innerWidth / innerHeight;
  const narrow = aspect < 0.85;
  const mid = aspect < 1.3;
  return {
    pos: new THREE.Vector3(i*SPACING + (narrow?2.4:6.0), narrow?6.6:6.3, narrow?10.5:13.2),
    tgt: new THREE.Vector3(i*SPACING, mid?1.9:1.6, 0),
  };
}
const chips = (el, items) => { el.replaceChildren(...items.map(t => { const s=document.createElement("span"); s.className="chip"; s.textContent=t; return s; })); };

function go(i) {
  current = (i + STATIONS.length) % STATIONS.length;
  const st = STATIONS[current];
  const sheet = document.getElementById("sheet");
  if (!reduce) { sheet.classList.add("swapping"); }
  setTimeout(() => {
    document.getElementById("who").textContent = st.who;
    document.getElementById("st-title").textContent = st.title;
    document.getElementById("st-desc").textContent = st.desc;
    chips(document.getElementById("in-list"), st.inputs);
    chips(document.getElementById("out-list"), st.outputs);
    document.getElementById("count").textContent = `${String(current+1).padStart(2,"0")} / ${String(STATIONS.length).padStart(2,"0")}`;
    [...dotsEl.children].forEach((d,k)=>{ d.setAttribute("aria-current", String(k===current)); d.toggleAttribute("aria-current", k===current); });
    sheet.classList.remove("swapping");
  }, reduce ? 0 : 160);
  rings.forEach((r,k)=>{ r.material.color.set(k===current?0x22d3ee:0x7c3aed); r.material.opacity = k===current?0.95:0.4; });
  platforms.forEach((p,k)=>{ p.material.emissive.set(k===current?0x4a1638:0x2a0d22); });
  autoT = 0;
}
document.getElementById("next").onclick = () => go(current + 1);
document.getElementById("prev").onclick = () => go(current - 1);
const playBtn = document.getElementById("play");
playBtn.onclick = () => { auto = !auto; playBtn.textContent = auto ? "Pausar" : "Reproducir"; playBtn.setAttribute("aria-pressed", String(!auto)); };
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(current + 1);
  else if (e.key === "ArrowLeft") go(current - 1);
  else if (e.key === " ") { e.preventDefault(); playBtn.click(); }
});
if (reduce) { playBtn.textContent = "Reproducir"; playBtn.setAttribute("aria-pressed","true"); }
go(0);

addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const clock = new THREE.Clock();
const camPos = camera.position.clone(), camTgt = controls.target.clone();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (!reduce) {
    for (const a of animated) {
      if (a.type === "person") { const u=a.g.userData; a.g.position.y = Math.sin(t*1.6+u.bob)*0.03; u.arms.forEach((arm,k)=>arm.rotation.x = Math.sin(t*1.6+u.bob+k*Math.PI)*0.12); }
      else if (a.type === "spin") { a.mesh.rotation.y += dt*0.7; if (a.y) a.mesh.position.y = a.y + Math.sin(t*1.5)*0.12; }
      else if (a.type === "scan") { a.mesh.scale.setScalar(1.0+Math.sin(t*3)*0.5); a.mesh.rotation.z += dt*1.5; }
      else if (a.type === "orbit") { a.ph += dt*a.sp; a.mesh.position.set(Math.cos(a.ph)*a.r, a.y+Math.sin(a.ph*2)*0.25, Math.sin(a.ph)*a.r); }
      else if (a.type === "wave") { a.mesh.position.y = 1.9 + Math.sin(t*3)*0.06; }
    }
  }
  const v = stationView(current);
  const k = reduce ? 1 : 1 - Math.pow(0.0016, dt);
  camPos.lerp(v.pos, k); camTgt.lerp(v.tgt, k);
  controls.target.copy(camTgt); camera.position.copy(camPos); controls.update();
  if (auto && !reduce) { autoT += dt; if (autoT > 7) go(current + 1); }
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
